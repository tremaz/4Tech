services:
  api:
    build: .
    container_name: trainsight-api
    ports:
      - "8000:8000"
    environment:
      - PORT=8000
    volumes:
      - ./output:/app/output
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
